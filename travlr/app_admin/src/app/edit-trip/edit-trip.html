<div class="container">
  <h2>Edit Trip</h2>

  <form *ngIf="trip" (ngSubmit)="onSubmit()">

    <p><strong>Trip Code:</strong> {{ trip.code }}</p>

    <div>
      <label>Trip Name:</label>
      <input name="name" [(ngModel)]="trip.name" required>
    </div>

    <div>
      <label>Length:</label>
      <input name="length" [(ngModel)]="trip.length" required>
    </div>

    <div>
      <label>Start Date:</label>
      <input type="date" name="start"
             [(ngModel)]="trip.start" required>
    </div>

    <div>
      <label>Resort:</label>
      <input name="resort" [(ngModel)]="trip.resort" required>
    </div>

    <div>
      <label>Price:</label>
      <input name="perPerson"
             [(ngModel)]="trip.perPerson" required>
    </div>

    <div>
      <label>Image:</label>
      <input name="image" [(ngModel)]="trip.image" required>
    </div>

    <div>
      <label>Description:</label>
      <textarea name="description"
                [(ngModel)]="trip.description"
                required></textarea>
    </div>

    <button type="submit">Update Trip</button>
  </form>

  <p>{{ message }}</p>
</div>
